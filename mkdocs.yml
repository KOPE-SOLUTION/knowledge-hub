site_name: KOPE SOLUTION
site_url: https://kope-solution.github.io/knowledge-hub/
site_description: ศูนย์รวมความรู้เชิงเทคนิค บทความ วิดีโอ โครงการ ผลงาน ผลิตภัณฑ์ และทรัพยากรของ KOPE SOLUTION
site_author: โก๊ป
repo_name: KOPE-SOLUTION/knowledge-hub
repo_url: https://github.com/KOPE-SOLUTION/knowledge-hub
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
use_directory_urls: true
exclude_docs: |
  !/templates/
  !/templates/**

theme:
  name: material
  custom_dir: overrides
  language: th
  logo: assets/images/kope-solution-mark.png
  favicon: assets/images/kope-solution-mark.png
  font: false
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: เปลี่ยนเป็นโหมดสว่าง
    - media: "(prefers-color-scheme: light)"
      scheme: kope-light
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: เปลี่ยนเป็นโหมดมืด
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang: en
      separator: '[\\s\\-\\.\\_/]+'
  - tags

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/site.js

extra:
  meta_keywords: KOPE SOLUTION, Embedded Systems, Industrial IoT, AIoT, IIoT, ESP32, STM32, Arduino, Sensors, MQTT, Modbus, Computer Vision, ภาษาไทย
  social_image: assets/images/social-placeholder.svg
  homepage: https://kope-solution.github.io/knowledge-hub/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KOPE-SOLUTION/knowledge-hub
      name: GitHub repository
    - icon: fontawesome/brands/youtube
      link: https://kope-solution.github.io/knowledge-hub/contact/#youtube
      name: YouTube (placeholder — update in mkdocs.yml)
    - icon: fontawesome/brands/facebook
      link: https://kope-solution.github.io/knowledge-hub/contact/#facebook
      name: Facebook (placeholder — update in mkdocs.yml)
    - icon: fontawesome/solid/envelope
      link: https://kope-solution.github.io/knowledge-hub/contact/#email
      name: Email (placeholder — update in mkdocs.yml)

copyright: Copyright &copy; 2026 KOPE SOLUTION · CONTRIBUTE — สร้างประโยชน์ต่อสังคม

